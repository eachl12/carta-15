<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta de hoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@400;500;600&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top: #6fb7e8;
    --sky-bottom: #bfe6ff;
    --grass-top: #6fbf3e;
    --grass-top-dark: #58a230;
    --dirt: #8a5a30;
    --dirt-dark: #6e4522;
    --wood: #7a5230;
    --wood-dark: #5e3e22;
    --leaf: #4a9a2e;
    --leaf-dark: #3a7a24;
    --gold: #d4af6a;
    --lavender: #4a5a3a;
    --parchment: #f6f1e2;
    --parchment-edge: #ded1ac;
    --ink: #3a2f22;
    --wine: #7a5230;
  }

  *{ box-sizing: border-box; image-rendering: pixelated; }

  html, body{
    margin:0; padding:0;
    height:100%; width:100%;
    overflow:hidden;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    font-family: 'EB Garamond', serif;
  }

  /* ===== VOXEL WORLD SCENE ===== */
  .scene{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .cloud-block{
    position:absolute;
    background: #fff;
    opacity: 0.9;
    animation: driftSide linear infinite;
  }
  @keyframes driftSide{
    0%{ transform: translateX(-10vw); }
    100%{ transform: translateX(110vw); }
  }
  .sun-block{
    position:absolute;
    top: 6%; right: 10%;
    width: 70px; height:70px;
    background: #ffe24a;
    box-shadow: 0 0 0 10px rgba(255,226,74,0.3);
  }
  .ground{
    position:absolute;
    left:0; right:0; bottom:0;
    height: 24vh;
  }
  .ground-top{
    position:absolute;
    left:0; right:0; top:0;
    height: 10px;
    background: var(--grass-top);
    box-shadow: inset 0 -4px 0 var(--grass-top-dark);
  }
  .ground-dirt{
    position:absolute;
    left:0; right:0; top:10px; bottom:0;
    background: var(--dirt);
    background-image:
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(0,0,0,0.08) 38px 40px),
      repeating-linear-gradient(90deg, transparent 0 38px, rgba(0,0,0,0.08) 38px 40px);
  }
  .grass-speck{
    position:absolute;
    width: 10px; height:10px;
    background: var(--grass-top-dark);
  }
  .drift{
    position:absolute;
    bottom:-10%;
    opacity:0;
    animation: driftUp linear infinite;
    will-change: transform, opacity;
  }
  @keyframes driftUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg) scale(var(--s,1)); opacity:0; }
    10%{ opacity: var(--o,0.5); }
    85%{ opacity: var(--o,0.5); }
    100%{ transform: translateY(-115vh) translateX(var(--drift,30px)) rotate(var(--rot,20deg)) scale(var(--s,1)); opacity:0; }
  }

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    height:100vh;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding-bottom: 6vh;
  }

  /* ===== CHARACTERS + HEART ===== */
  .couple-wrap{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .couple-wrap.hidden{ display:none; }

  .couple-svg{
    width: min(280px, 76vw);
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 8px 0 rgba(0,0,0,0.25));
  }
  .bob-l{ animation: bobL 2.4s steps(2) infinite; transform-origin: 50% 100%; }
  .bob-r{ animation: bobR 2.4s steps(2) infinite; transform-origin: 50% 100%; }
  @keyframes bobL{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-3px); } }
  @keyframes bobR{ 0%,100%{ transform: translateY(-3px); } 50%{ transform: translateY(0); } }

  .heart-tap{ cursor:pointer; }
  .heart-block{
    animation: heartBlink steps(2) 1s infinite;
  }
  @keyframes heartBlink{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.18); }
  }

  .couple-wrap.opening .couple-svg{
    transition: transform 0.5s steps(6), opacity 0.4s ease-in;
    transform: scale(0.1) translateY(20px);
    opacity:0;
  }
  .couple-wrap.opening{ pointer-events:none; }

  .couple-hint{
    margin-top: 16px;
    color: #2a4a1e;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 18px;
    letter-spacing: 0.5px;
    text-align:center;
    text-shadow: 0 1px 4px rgba(255,255,255,0.6);
  }
  .day-badge{
    margin-top: 8px;
    color: #5a3a16;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 1px 4px rgba(255,255,255,0.6);
  }

  /* ===== LETTER (scroll, open state) ===== */
  .letter-container{
    position:fixed;
    inset:0;
    z-index: 6;
    opacity:0;
    transform: scale(0.97);
    transition: opacity 0.8s ease, transform 0.8s cubic-bezier(.2,.7,.3,1.1);
    pointer-events:none;
  }
  .letter-container.show{
    opacity:1;
    transform: scale(1);
    pointer-events:auto;
  }

  .scroll{
    position:relative;
    width:100%;
    height:100%;
    max-width: 720px;
    margin: 0 auto;
    background:
      radial-gradient(ellipse at top left, rgba(180,150,60,0.10), transparent 55%),
      var(--parchment);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 90px rgba(0,0,0,0.4);
  }
  @media (min-width: 640px){
    .letter-container{
      display:flex; align-items:center; justify-content:center;
      padding: 4vh 0;
    }
    .scroll{
      height: 92vh;
      border-radius: 3px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4), 0 0 0 1px var(--parchment-edge);
    }
  }

  .scroll::before{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 33px, rgba(122,90,48,0.06) 34px);
    opacity:0.5;
  }

  .scroll-header{
    flex-shrink:0;
    padding: 34px 40px 8px;
    text-align:center;
    border-bottom: 1px solid rgba(122,90,48,0.18);
  }
  .scroll-header .day{
    font-family:'Cinzel', serif;
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--wine);
    opacity:0.75;
  }
  .scroll-header .date{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 17px;
    color: var(--ink);
    opacity:0.65;
    margin-top: 10px;
  }
  .scroll-header .date:empty{ display:none; }
  .scroll-header .title{
    font-family:'Cinzel', serif;
    font-size: 26px;
    color: var(--wine);
    margin-top: 8px;
    letter-spacing: 1px;
  }

  .scroll-body{
    flex:1;
    overflow-y:auto;
    padding: 20px 44px 34px;
    scrollbar-width: thin;
    scrollbar-color: var(--gold) transparent;
  }
  .scroll-body::-webkit-scrollbar{ width:6px; }
  .scroll-body::-webkit-scrollbar-thumb{ background: var(--parchment-edge); border-radius:4px; }
  .scroll-body::-webkit-scrollbar-thumb:hover{ background: var(--gold); }

  .letter-text{
    position:relative; z-index:2;
    font-family:'Cormorant Garamond', serif;
    font-size: 21px;
    line-height: 1.75;
    color: var(--ink);
  }
  .letter-text p{ margin: 0 0 18px; }

  .letter-drift{
    position:absolute; inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }

  .close-btn{
    position:absolute;
    top:12px; right:16px;
    z-index: 10;
    background:none; border:none;
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size:15px;
    color: var(--gold);
    cursor:pointer;
    opacity:0.7;
    transition: opacity 0.2s ease;
  }
  .close-btn:hover{ opacity:1; }

  .music-btn{
    position:absolute;
    top:12px; left:16px;
    z-index: 10;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--parchment-edge);
    background: var(--parchment);
    color: var(--wine);
    font-size:15px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    transition: transform 0.2s ease, opacity 0.2s ease;
    opacity:0.85;
  }
  .music-btn:hover{ transform: scale(1.08); opacity:1; }
  .music-btn .note-playing{ display:none; }
  .music-btn.playing .note-idle{ display:none; }
  .music-btn.playing .note-playing{ display:inline; }
  .music-btn.playing{ animation: notePulse 1.6s ease-in-out infinite; }
  @keyframes notePulse{
    0%,100%{ box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    50%{ box-shadow: 0 2px 14px rgba(122,90,48,0.4); }
  }

  @media (max-width: 480px){
    .letter-text{ font-size: 18px; }
    .scroll-header .title{ font-size: 22px; }
    .scroll-body{ padding: 14px 26px 26px; }
    .scroll-header{ padding: 26px 26px 8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .drift, .cloud-block, .bob-l, .bob-r, .heart-block{ animation: none !important; }
    .letter-container{ transition: opacity 0.3s ease !important; }
  }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="sun-block"></div>
  <div class="ground" id="ground">
    <div class="ground-dirt"></div>
    <div class="ground-top"></div>
  </div>
</div>

<div class="stage">
  <div class="couple-wrap" id="coupleWrap">
    <div class="day-badge" id="dayBadge">21/09/26</div>

    <svg class="couple-svg" viewBox="0 0 340 210" xmlns="http://www.w3.org/2000/svg">

      <!-- ===== PAREJA (desplazada hacia abajo para dejar espacio al corazón arriba) ===== -->
      <g transform="translate(0,35)">

      <!-- ===== CHICO (pelo negro) =====
           OJO: la posición (translate) va en un <g> propio, separado del <g class="bob-l">
           que lleva la animación CSS, porque una animación CSS de transform
           reemplaza por completo el atributo transform="translate(...)" del MISMO
           elemento (no se combinan). Si van juntos, el personaje salta a (0,0). -->
      <g transform="translate(120,0)">
      <g class="bob-l">
        <!-- legs -->
        <rect x="-16" y="118" width="14" height="38" fill="#2b3a52"/>
        <rect x="2"   y="118" width="14" height="38" fill="#22304a"/>
        <!-- torso -->
        <rect x="-20" y="76" width="40" height="46" fill="#d4453a"/>
        <rect x="6" y="76" width="6" height="46" fill="#b03a2f"/>
        <!-- far arm -->
        <rect x="-34" y="80" width="14" height="38" fill="#b03a2f"/>
        <rect x="-34" y="114" width="14" height="10" fill="#e8b382"/>
        <!-- near arm: dos bloques, manga + mano, llega limpio hasta el punto de encuentro -->
        <rect x="20" y="82" width="14" height="16" fill="#d4453a"/>
        <rect x="30" y="96" width="16" height="14" fill="#e8b382"/>
        <!-- head -->
        <rect x="-20" y="30" width="40" height="40" fill="#e8b382"/>
        <rect x="4" y="30" width="6" height="40" fill="#d49a68"/>
        <!-- hair -->
        <rect x="-22" y="22" width="44" height="14" fill="#161616"/>
        <rect x="-22" y="34" width="8" height="14" fill="#161616"/>
        <rect x="14" y="34" width="8" height="14" fill="#161616"/>
        <!-- face -->
        <rect x="-12" y="48" width="7" height="7" fill="#1c1c1c"/>
        <rect x="2" y="48" width="7" height="7" fill="#1c1c1c"/>
        <rect x="-8" y="60" width="14" height="4" fill="#a8603c"/>
      </g>
      </g>

      <!-- ===== CHICA (canchita / rubia) ===== -->
      <g transform="translate(210,0)">
      <g class="bob-r">
        <!-- legs -->
        <rect x="-16" y="118" width="14" height="38" fill="#7a3fa0"/>
        <rect x="2"   y="118" width="14" height="38" fill="#632f82"/>
        <!-- torso -->
        <rect x="-20" y="76" width="40" height="46" fill="#b57be0"/>
        <rect x="6" y="76" width="6" height="46" fill="#9b4fc9"/>
        <!-- far arm -->
        <rect x="20" y="80" width="14" height="38" fill="#9b4fc9"/>
        <rect x="20" y="114" width="14" height="10" fill="#f0c9a0"/>
        <!-- near arm: dos bloques, manga + mano, llega limpio hasta el punto de encuentro -->
        <rect x="-34" y="82" width="14" height="16" fill="#b57be0"/>
        <rect x="-46" y="96" width="16" height="14" fill="#f0c9a0"/>
      </g>
      </g>

      <!-- sombra sutil justo donde las manos se juntan, para que se lea como un solo agarre -->
      <rect x="161" y="104" width="10" height="6" fill="#c89468" opacity="0.45"/>

      <!-- cabeza y detalles de la chica (encima de las manos para que no se encimen) -->
      <g transform="translate(210,0)">
      <g class="bob-r">
        <!-- head -->
        <rect x="-20" y="30" width="40" height="40" fill="#f0c9a0"/>
        <rect x="4" y="30" width="6" height="40" fill="#e0ac82"/>
        <!-- hair (blonde, with pigtail blocks) -->
        <rect x="-22" y="20" width="44" height="16" fill="#f6d84a"/>
        <rect x="-30" y="34" width="10" height="26" fill="#f6d84a"/>
        <rect x="20" y="34" width="10" height="26" fill="#f6d84a"/>
        <!-- face -->
        <rect x="-12" y="48" width="7" height="7" fill="#1c1c1c"/>
        <rect x="2" y="48" width="7" height="7" fill="#1c1c1c"/>
        <rect x="-8" y="60" width="14" height="4" fill="#c2557a"/>
      </g>
      </g>

      </g>

      <!-- ===== PIXEL HEART (tap target), flotando arriba de las cabezas, bien separado ===== -->
      <g class="heart-tap" id="heartTap" transform="translate(165,28)">
        <ellipse cx="0" cy="2" rx="36" ry="32" fill="#fff3b0" opacity="0.35"/>
        <g transform="scale(1.3)">
          <g class="heart-block" fill="#e2312a">
            <!-- fila 0: dos picos -->
            <rect x="-8" y="-18" width="8" height="8"/>
            <rect x="8" y="-18" width="8" height="8"/>
            <!-- fila 1: ancho completo -->
            <rect x="-16" y="-10" width="8" height="8"/>
            <rect x="-8" y="-10" width="8" height="8"/>
            <rect x="0" y="-10" width="8" height="8"/>
            <rect x="8" y="-10" width="8" height="8"/>
            <rect x="16" y="-10" width="8" height="8"/>
            <!-- fila 2: ancho completo -->
            <rect x="-16" y="-2" width="8" height="8"/>
            <rect x="-8" y="-2" width="8" height="8"/>
            <rect x="0" y="-2" width="8" height="8"/>
            <rect x="8" y="-2" width="8" height="8"/>
            <rect x="16" y="-2" width="8" height="8"/>
            <!-- fila 3: se angosta -->
            <rect x="-8" y="6" width="8" height="8"/>
            <rect x="0" y="6" width="8" height="8"/>
            <rect x="8" y="6" width="8" height="8"/>
            <!-- fila 4: punta -->
            <rect x="0" y="14" width="8" height="8"/>
          </g>
        </g>
      </g>
    </svg>

    <div class="couple-hint">toca el corazón para leer la carta de hoy</div>
  </div>

  <div class="letter-container" id="letterContainer">
    <div class="scroll">
      <button class="close-btn" id="closeBtn">cerrar ✕</button>
      <button class="music-btn" id="musicBtn" aria-label="Pausar o reproducir música">
        <span class="note-idle">🎵</span><span class="note-playing">⏸</span>
      </button>
      <audio id="bgAudio" src="cancion.mp3" loop preload="auto"></audio>
      <div class="letter-drift" id="letterDrift"></div>

      <div class="scroll-header">
        <div class="day" id="dayLabel">21/09/26</div>
        <div class="title" id="titleLabel">Carta 15</div>
        <div class="date" id="subtitleLabel"></div>
      </div>

      <div class="scroll-body">
        <div class="letter-text" id="letterText">
<p>[Aquí va el texto de hoy — mándamelo y lo coloco tal cual, sin cambiar nada.]</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  /* ====== CONFIGURA AQUÍ CADA DÍA ======
     1) DAY_NUMBER: el número de carta (15, 16, 17...)
     2) DATE_LABEL: la fecha de hoy, como quieras mostrarla
     3) SUBTITLE_TEXT: frase fija bajo el título (vacío = no se muestra nada)
     4) El texto se reemplaza dentro de #letterText en cada carta.
     5) Cambia el src del audio por el nombre de la canción/audio de hoy.
  ============================================ */
  const DAY_NUMBER = 15;
  const DATE_LABEL = '21/09/26';
  const SUBTITLE_TEXT = '';

  document.getElementById('dayBadge').textContent = DATE_LABEL;
  document.getElementById('dayLabel').textContent = DATE_LABEL;
  document.getElementById('titleLabel').textContent = 'Carta ' + DAY_NUMBER;
  document.getElementById('subtitleLabel').textContent = SUBTITLE_TEXT;

  function rand(min, max){ return Math.random() * (max - min) + min; }

  // nubes de bloques
  const scene = document.getElementById('scene');
  const cloudConfigs = [
    { top: '10%', w: 70, h: 24, dur: 55 },
    { top: '18%', w: 50, h: 18, dur: 70 },
    { top: '6%',  w: 40, h: 16, dur: 65 },
  ];
  cloudConfigs.forEach(c => {
    const cloud = document.createElement('div');
    cloud.className = 'cloud-block';
    cloud.style.top = c.top;
    cloud.style.width = c.w + 'px';
    cloud.style.height = c.h + 'px';
    cloud.style.animationDuration = c.dur + 's';
    cloud.style.animationDelay = '-' + rand(0, c.dur) + 's';
    scene.appendChild(cloud);
  });

  // pastito (puntitos de bloque sobre el césped)
  const ground = document.getElementById('ground');
  for(let i=0; i<40; i++){
    const g = document.createElement('div');
    g.className = 'grass-speck';
    g.style.left = rand(0,100) + '%';
    g.style.top = rand(-6,4) + 'px';
    ground.appendChild(g);
  }

  // corazones y destellos flotando
  const DRIFT_SYMBOLS = ['💗','❤️‍🩹','💕','✨'];
  function spawnDrift(containerId, count, sizeRange, opacityRange, durationRange, className){
    const container = document.getElementById(containerId);
    for(let i=0; i<count; i++){
      const el = document.createElement('span');
      el.className = className;
      el.textContent = DRIFT_SYMBOLS[Math.floor(Math.random()*DRIFT_SYMBOLS.length)];
      const size = rand(14,22);
      const duration = rand(11,20);
      const delay = rand(0,20);
      el.style.left = rand(0,100) + '%';
      el.style.fontSize = size + 'px';
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = '-' + delay + 's';
      el.style.setProperty('--drift', rand(-60,60) + 'px');
      el.style.setProperty('--rot', rand(-30,30) + 'deg');
      el.style.setProperty('--o', rand(opacityRange[0], opacityRange[1]));
      el.style.setProperty('--s', rand(0.8,1.15));
      container.appendChild(el);
    }
  }
  spawnDrift('scene', 8, [14,22], [0.3,0.55], [11,20], 'drift');
  spawnDrift('letterDrift', 12, [14,22], [0.10,0.20], [9,16], 'drift');

  const coupleWrap = document.getElementById('coupleWrap');
  const heartTap = document.getElementById('heartTap');
  const letterContainer = document.getElementById('letterContainer');
  const closeBtn = document.getElementById('closeBtn');
  const musicBtn = document.getElementById('musicBtn');
  const bgAudio = document.getElementById('bgAudio');

  function playMusic(){
    bgAudio.play().then(() => musicBtn.classList.add('playing'))
      .catch(() => musicBtn.classList.remove('playing'));
  }
  function pauseMusic(){
    bgAudio.pause();
    musicBtn.classList.remove('playing');
  }

  heartTap.addEventListener('click', () => {
    coupleWrap.classList.add('opening');
    setTimeout(() => {
      coupleWrap.classList.add('hidden');
      letterContainer.classList.add('show');
    }, 500);
    playMusic();
  });

  closeBtn.addEventListener('click', () => {
    letterContainer.classList.remove('show');
    setTimeout(() => {
      coupleWrap.classList.remove('hidden');
      coupleWrap.classList.remove('opening');
    }, 400);
    pauseMusic();
  });

  musicBtn.addEventListener('click', () => {
    if(bgAudio.paused){ playMusic(); } else { pauseMusic(); }
  });
</script>

</body>
</html>
